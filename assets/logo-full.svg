<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B4EA2"/>
      <stop offset="100%" stop-color="#061A38"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="36" fill="#F5F9FF"/>

  <!-- Logo Mark Section -->
  <g transform="translate(50 50)" filter="url(#shadow)">
    <!-- Main Square Background -->
    <rect x="0" y="0" width="260" height="260" rx="46" fill="url(#grad2)"/>
    
    <!-- Inner Glow -->
    <rect x="54" y="40" width="152" height="180" rx="22" fill="#EAF5FF" fill-opacity="0.15"/>

    <!-- Main T Letter -->
    <path d="M74 54H186V83H145V206H115V83H74V54Z" fill="url(#grad1)" stroke="#FFE680" stroke-width="2" opacity="0.95"/>
    
    <!-- Circuit Lines - Top Left -->
    <g stroke="#78C3FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <line x1="44" y1="210" x2="20" y2="210"/>
      <line x1="20" y1="210" x2="20" y2="158"/>
      <line x1="20" y1="158" x2="0" y2="158"/>
    </g>

    <!-- Circuit Lines - Top Right -->
    <g stroke="#78C3FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <line x1="216" y1="210" x2="240" y2="210"/>
      <line x1="240" y1="210" x2="240" y2="158"/>
      <line x1="240" y1="158" x2="260" y2="158"/>
    </g>

    <!-- Circuit Lines - Bottom Left -->
    <g stroke="#78C3FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <line x1="38" y1="38" x2="18" y2="38"/>
      <line x1="18" y1="38" x2="18" y2="90"/>
      <line x1="18" y1="90" x2="0" y2="90"/>
    </g>

    <!-- Circuit Lines - Bottom Right -->
    <g stroke="#78C3FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <line x1="222" y1="38" x2="242" y2="38"/>
      <line x1="242" y1="38" x2="242" y2="90"/>
      <line x1="242" y1="90" x2="260" y2="90"/>
    </g>

    <!-- Connection Dots -->
    <circle cx="20" cy="210" r="9" fill="#78C3FF"/>
    <circle cx="240" cy="210" r="9" fill="#78C3FF"/>
    <circle cx="20" cy="38" r="9" fill="#78C3FF"/>
    <circle cx="240" cy="38" r="9" fill="#78C3FF"/>

    <!-- Bottom Indicator Dots -->
    <circle cx="112" cy="244" r="8" fill="#FFD700"/>
    <circle cx="148" cy="244" r="8" fill="#FFD700"/>
    <circle cx="130" cy="244" r="8" fill="#78C3FF"/>
  </g>

  <!-- Text Section -->
  <g transform="translate(370 120)">
    <!-- Main Brand Name -->
    <text x="0" y="90" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="88" letter-spacing="3" fill="#0B224A">TALMA</text>
    
    <!-- Sub Brand Name -->
    <text x="0" y="170" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="70" letter-spacing="2" fill="#0D5CC9">TECHNOLOGY</text>
    
    <!-- Accent Line -->
    <rect x="0" y="206" width="520" height="8" rx="4" fill="url(#grad1)"/>
    
    <!-- Tagline -->
    <text x="0" y="258" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="2" fill="#607B9E">SMART TECHNOLOGY • RELIABLE SOLUTIONS</text>
  </g>
</svg>